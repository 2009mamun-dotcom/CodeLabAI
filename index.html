<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural University College, Mymensingh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        .fb-shadow { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <div class="max-w-4xl mx-auto bg-white fb-shadow overflow-hidden">
        <div class="relative h-48 md:h-80 bg-gray-200">
            <img src="cover.png" alt="Cover Photo" class="w-full h-full object-cover">
            
            <div class="absolute -bottom-12 left-4 md:left-8">
                <img src="profile.png" alt="Profile" class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-white object-cover bg-white">
            </div>
        </div>

        <div class="mt-14 px-4 md:px-8 pb-4">
            <h1 class="text-2xl md:text-3xl font-bold">Agricultural University College, Mymensingh</h1>
            <div class="flex gap-2 text-gray-600 font-semibold mt-1 text-sm">
                <span>27K followers</span>
                <span>•</span>
                <span>70 following</span>
            </div>
            
            <div class="flex gap-2 mt-4">
                <button class="bg-[#1877F2] text-white px-6 py-2 rounded-lg font-semibold flex items-center gap-2 hover:bg-blue-700 transition">
                    <i class="fa-solid fa-link"></i> Contact Us
                </button>
                <button class="bg-gray-200 text-black px-6 py-2 rounded-lg font-semibold flex items-center gap-2 hover:bg-gray-300 transition">
                    <i class="fa-solid fa-bell"></i> Following
                </button>
            </div>
        </div>

        <div class="flex border-t mt-2 px-4 text-gray-600 font-semibold">
            <button class="px-4 py-4 border-b-4 border-blue-600 text-blue-600">All</button>
            <button class="px-4 py-4 hover:bg-gray-100 rounded-md">Photos</button>
            <button class="px-4 py-4 hover:bg-gray-100 rounded-md">Reels</button>
            <button class="px-4 py-4 hover:bg-gray-100 rounded-md">Mentions</button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto mt-4 grid grid-cols-1 md:grid-cols-5 gap-4 px-2 md:px-0">
        
        <div class="md:col-span-2 space-y-4">
            <div class="bg-white p-4 rounded-lg fb-shadow">
                <h2 class="text-xl font-bold mb-4">Details</h2>
                <div class="space-y-4">
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-star text-gray-500 mt-1"></i>
                        <span>100% recommend (6 reviews)</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-location-dot text-gray-500 mt-1"></i>
                        <span>Mymensingh, Dhaka Division, Bangladesh</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-link text-gray-500 mt-1"></i>
                        <a href="https://aucm.edu.bd" class="text-blue-600 font-semibold hover:underline">aucm.edu.bd</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-3 space-y-4" id="post-feed">
            <div class="text-center py-10 text-gray-500">Loading posts...</div>
        </div>
    </div>

    <script>
        // Fetching data from posts.json
        async function loadPosts() {
            try {
                const response = await fetch('posts.json');
                const posts = await response.json();
                const container = document.getElementById('post-feed');
                container.innerHTML = ''; // Clear loading text

                posts.forEach(post => {
                    const postCard = `
                        <div class="bg-white rounded-lg fb-shadow overflow-hidden">
                            <div class="p-4 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <img src="profile.png" class="w-10 h-10 rounded-full">
                                    <div>
                                        <p class="font-bold text-sm hover:underline cursor-pointer">Agricultural University College, Mymensingh</p>
                                        <p class="text-xs text-gray-500 flex items-center gap-1">
                                            ${post.time} • <i class="fa-solid fa-earth-americas"></i>
                                        </p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-ellipsis text-gray-600"></i>
                            </div>

                            <div class="px-4 pb-3 text-[15px] leading-snug text-gray-900">
                                ${post.caption}
                            </div>

                            ${post.img ? `<img src="${post.img}" class="w-full h-auto border-y">` : ''}

                            <div class="p-3 flex justify-between text-gray-500 border-t mx-4 text-sm font-semibold">
                                <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-100 p-2 rounded-md flex-1 justify-center transition">
                                    <i class="fa-regular fa-thumbs-up"></i> Like
                                </div>
                                <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-100 p-2 rounded-md flex-1 justify-center transition">
                                    <i class="fa-regular fa-comment"></i> Comment
                                </div>
                                <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-100 p-2 rounded-md flex-1 justify-center transition">
                                    <i class="fa-solid fa-share"></i> Share
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += postCard;
                });
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('post-feed').innerHTML = '<p class="text-red-500">Failed to load posts. Make sure posts.json exists.</p>';
            }
        }

        window.onload = loadPosts;
    </script>
</body>
</html>
